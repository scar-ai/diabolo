services:
  db:
    image: postgres:17.10-alpine3.23
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_tanstarter:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: tanstarter
      POSTGRES_PASSWORD: password
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tanstarter"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_tanstarter:
